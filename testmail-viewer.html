<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Testmail Inbox Viewer</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        --bg: #0f1115;
        --panel: #1b1f27;
        --panel-alt: #232a33;
        --accent: #4ea1ff;
        --accent-grad: #4ea1ff99;
        --text: #f5f7fa;
        --muted: #9aa4b1;
        --danger: #ff4e5e;
        --radius: 8px;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono',
          monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu,
          sans-serif;
        background: linear-gradient(135deg, #12161d, #0c1014);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        padding: 14px 18px;
        background: #12161a;
        border-bottom: 1px solid #222a33;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      h1 {
        font-size: 16px;
        margin: 0 12px 0 0;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 600;
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
      }
      input {
        background: var(--panel-alt);
        border: 1px solid #2d3640;
        color: var(--text);
        padding: 6px 8px;
        border-radius: 5px;
        font-size: 13px;
        min-width: 180px;
      }
      input:focus {
        outline: 2px solid #2d6fbf;
        outline-offset: 1px;
      }
      button {
        cursor: pointer;
        background: linear-gradient(120deg, var(--accent), #1e74d8);
        color: #fff;
        border: 1px solid #2d6fbf;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      button.secondary {
        background: var(--panel-alt);
        border-color: #394655;
        color: var(--muted);
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      main {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      #sidebar {
        width: 340px;
        max-width: 50%;
        border-right: 1px solid #202830;
        background: var(--panel);
        display: flex;
        flex-direction: column;
      }
      #emailsHeader {
        padding: 10px 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #242e38;
      }
      #listContainer {
        flex: 1;
        overflow: auto;
      }
      #emailsList {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      #emailsList li {
        border-bottom: 1px solid #1f2730;
        padding: 10px 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
        background: transparent;
        transition: background 0.15s;
      }
      #emailsList li:hover {
        background: var(--panel-alt);
      }
      #emailsList li.active {
        background: #25486a;
      }
      .email-subject {
        font-weight: 600;
        font-size: 13px;
        line-height: 1.3;
        color: #e4e9ef;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .email-from {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .email-meta {
        font-size: 10px;
        color: #607080;
        display: flex;
        gap: 6px;
        align-items: center;
        flex-wrap: wrap;
      }
      #viewer {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      #viewerTop {
        padding: 10px 14px;
        background: var(--panel);
        border-bottom: 1px solid #242e38;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      #status {
        font-size: 12px;
        color: var(--muted);
        flex: 1;
      }
      #viewToggle {
        display: none;
        gap: 4px;
      }
      #viewToggle button {
        padding: 4px 10px;
        font-size: 11px;
        background: var(--panel-alt);
        border-color: #394655;
        color: var(--muted);
      }
      #viewToggle button.active {
        background: linear-gradient(120deg, var(--accent), #1e74d8);
        border-color: #2d6fbf;
        color: #fff;
      }
      #frameContainer {
        flex: 1;
        position: relative;
        display: flex;
      }
      iframe {
        flex: 1;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      #textViewer {
        flex: 1;
        width: 100%;
        height: 100%;
        overflow: auto;
        background: #fff;
        color: #222;
        padding: 20px;
        font-family: var(--mono);
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-wrap: break-word;
        display: none;
      }
      #empty {
        margin: auto;
        text-align: center;
        color: #6c7a88;
        font-size: 14px;
        max-width: 480px;
        line-height: 1.5;
        padding: 20px;
      }
      footer {
        font-size: 11px;
        padding: 8px 14px;
        text-align: right;
        color: #5d6a78;
        background: #12161a;
        border-top: 1px solid #202830;
      }
      small.code {
        font-family: var(--mono);
        font-size: 11px;
        background: #1e252d;
        padding: 2px 5px;
        border-radius: 4px;
      }
      #configPanel {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        flex-wrap: wrap;
      }
      .notice {
        color: var(--muted);
        font-size: 11px;
        margin-left: auto;
      }
      .badge {
        background: #203040;
        color: #8bb4d6;
        padding: 2px 6px 3px;
        border-radius: 4px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .spinner {
        width: 14px;
        height: 14px;
        border: 3px solid #2d3b49;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error {
        color: var(--danger);
        font-size: 12px;
        padding: 6px 10px;
        background: #35191d;
        border: 1px solid #5a2027;
        border-radius: 5px;
        margin: 6px 12px;
      }
      .inline-link {
        color: var(--accent);
        text-decoration: none;
      }
      .inline-link:hover {
        text-decoration: underline;
      }
      @media (max-width: 900px) {
        #sidebar {
          width: 300px;
        }
        header {
          flex-direction: column;
          align-items: flex-start;
        }
        #configPanel {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Testmail Inbox</h1>
      <div id="configPanel">
        <div>
          <label for="apikey">API Key</label>
          <input
            id="apikey"
            type="password"
            placeholder="apikey"
            autocomplete="off"
          />
        </div>
        <div>
          <label for="namespace">Namespace</label>
          <input
            id="namespace"
            type="text"
            placeholder="namespace"
            autocomplete="off"
          />
        </div>
        <div>
          <label for="tag">Tag (optional)</label>
          <input
            id="tag"
            type="text"
            placeholder="Exact tag filter"
            autocomplete="off"
          />
        </div>
        <div>
          <label for="limit">Limit</label>
          <input id="limit" type="number" min="1" max="100" value="25" />
        </div>
        <div
          style="
            display: flex;
            gap: 8px;
            align-items: flex-end;
            padding-bottom: 4px;
          "
        >
          <button id="refreshBtn" title="Fetch emails (does not auto-refresh)">
            Refresh
          </button>
          <button
            id="clearBtn"
            class="secondary"
            title="Clear saved credentials"
          >
            Clear
          </button>
        </div>
      </div>
      <div class="notice">
        Credentials are stored locally in <code>localStorage</code> only.
      </div>
    </header>
    <main>
      <section id="sidebar">
        <div id="emailsHeader">
          <span class="badge" id="countBadge">0</span>
          <div id="loadingIndicator" style="display: none" aria-label="Loading">
            <div class="spinner"></div>
          </div>
        </div>
        <div id="listContainer">
          <ul id="emailsList"></ul>
        </div>
        <div id="errors"></div>
      </section>
      <section id="viewer">
        <div id="viewerTop">
          <div id="status">Enter credentials then click Refresh.</div>
          <div id="viewToggle">
            <button id="btnHtml" class="active">HTML</button>
            <button id="btnText">Text</button>
          </div>
        </div>
        <div id="frameContainer">
          <div id="empty">
            No email selected.<br /><br />Select a message on the left to view
            its content.
          </div>
          <iframe id="htmlFrame" style="display: none"></iframe>
          <div id="textViewer"></div>
        </div>
      </section>
    </main>
    <footer>
      <span
        >Built for quick local testing • Uses Testmail JSON API •
        <a
          class="inline-link"
          href="https://testmail.app/docs/"
          target="_blank"
          rel="noopener noreferrer"
          >Docs</a
        ></span
      >
    </footer>
    <script>
      (function () {
        const $ = (sel) => document.querySelector(sel);
        const apikeyEl = $('#apikey');
        const namespaceEl = $('#namespace');
        const tagEl = $('#tag');
        const limitEl = $('#limit');
        const refreshBtn = $('#refreshBtn');
        const clearBtn = $('#clearBtn');
        const listEl = $('#emailsList');
        const countBadge = $('#countBadge');
        const statusEl = $('#status');
        const loadingIndicator = $('#loadingIndicator');
        const errorsEl = $('#errors');
        const frame = $('#htmlFrame');
        const textViewer = $('#textViewer');
        const emptyState = $('#empty');
        const viewToggle = $('#viewToggle');
        const btnHtml = $('#btnHtml');
        const btnText = $('#btnText');

        let lastResult = null;
        let activeId = null;
        let currentEmail = null;
        let currentView = 'html';

        const LS_KEY = 'testmailViewerConfigV1';

        function loadConfig() {
          try {
            const cfg = JSON.parse(localStorage.getItem(LS_KEY));
            if (cfg) {
              apikeyEl.value = cfg.apikey || '';
              namespaceEl.value = cfg.namespace || '';
              tagEl.value = cfg.tag || '';
              limitEl.value = cfg.limit || 25;
            }
          } catch (e) {}
        }
        function saveConfig() {
          const cfg = {
            apikey: apikeyEl.value.trim(),
            namespace: namespaceEl.value.trim(),
            tag: tagEl.value.trim(),
            limit: parseInt(limitEl.value, 10) || 25,
          };
          localStorage.setItem(LS_KEY, JSON.stringify(cfg));
        }
        function clearConfig() {
          localStorage.removeItem(LS_KEY);
          apikeyEl.value = '';
          namespaceEl.value = '';
          tagEl.value = '';
          limitEl.value = 25;
        }

        function setLoading(on) {
          loadingIndicator.style.display = on ? 'block' : 'none';
          refreshBtn.disabled = on;
        }

        function fmtDate(ts) {
          const d = new Date(ts);
          return d.toLocaleString();
        }

        function showError(msg) {
          const div = document.createElement('div');
          div.className = 'error';
          div.textContent = msg;
          errorsEl.appendChild(div);
          setTimeout(() => {
            div.remove();
          }, 8000);
        }

        function sanitizeHtml(html) {
          // minimal neutralization for embedding from trusted source (Testmail). Optionally integrate DOMPurify if needed.
          // We trust the email content for test viewing; for stricter security sanitize thoroughly.
          return html || '';
        }

        function showEmailContent(email, viewType) {
          currentEmail = email;
          const hasHtml = !!(email.html && email.html.trim());
          const hasText = !!(email.text && email.text.trim());

          // Determine which view to use
          let finalView = viewType || currentView;
          if (finalView === 'html' && !hasHtml) {
            finalView = 'text';
          }
          if (finalView === 'text' && !hasText) {
            finalView = 'html';
          }
          currentView = finalView;

          // Show toggle buttons if both formats available
          if (hasHtml && hasText) {
            viewToggle.style.display = 'flex';
            btnHtml.classList.toggle('active', currentView === 'html');
            btnText.classList.toggle('active', currentView === 'text');
          } else {
            viewToggle.style.display = 'none';
          }

          // Display content
          emptyState.style.display = 'none';
          if (currentView === 'html' && hasHtml) {
            frame.style.display = 'block';
            textViewer.style.display = 'none';
            frame.srcdoc = sanitizeHtml(email.html);
          } else if (currentView === 'text' && hasText) {
            frame.style.display = 'none';
            textViewer.style.display = 'block';
            textViewer.textContent = email.text;
          } else {
            // No content available
            frame.style.display = 'none';
            textViewer.style.display = 'none';
            emptyState.style.display = 'flex';
            emptyState.innerHTML = 'This email has no viewable content.';
          }
        }

        function buildQuery() {
          const base = 'https://api.testmail.app/api/json';
          const params = new URLSearchParams();
          params.set('apikey', apikeyEl.value.trim());
          params.set('namespace', namespaceEl.value.trim());
          const tag = tagEl.value.trim();
          if (tag) params.set('tag', tag);
          const limit = parseInt(limitEl.value, 10) || 25;
          params.set('limit', String(Math.min(Math.max(limit, 1), 100)));
          // Include headers for potential extension; not strictly needed now
          // params.set('headers','true');
          return base + '?' + params.toString();
        }

        function renderList(emails) {
          listEl.innerHTML = '';
          emails.forEach((e, i) => {
            const li = document.createElement('li');
            li.dataset.idx = i;
            const subj = document.createElement('div');
            subj.className = 'email-subject';
            subj.textContent = e.subject || '(no subject)';
            const from = document.createElement('div');
            from.className = 'email-from';
            from.textContent = e.from || '(unknown sender)';
            const meta = document.createElement('div');
            meta.className = 'email-meta';
            meta.innerHTML = `<span>${e.tag || '-'}</span><span>${fmtDate(
              e.timestamp
            )}</span>`;
            li.appendChild(subj);
            li.appendChild(from);
            li.appendChild(meta);
            li.addEventListener('click', () => selectEmail(i));
            listEl.appendChild(li);
          });
        }

        function selectEmail(idx) {
          if (!lastResult || !lastResult.emails) return;
          const email = lastResult.emails[idx];
          activeId = email.id || idx;
          [...listEl.children].forEach((li) =>
            li.classList.toggle('active', li.dataset.idx == idx)
          );
          showEmailContent(email, 'html'); // Default to HTML
          statusEl.textContent = email.subject || '(no subject)';
        }

        function refresh() {
          errorsEl.innerHTML = '';
          const apikey = apikeyEl.value.trim();
          const namespace = namespaceEl.value.trim();
          if (!apikey || !namespace) {
            showError('API key and namespace are required.');
            return;
          }
          saveConfig();
          const url = buildQuery();
          setLoading(true);
          statusEl.textContent = 'Loading...';
          fetch(url, { method: 'GET' })
            .then(async (r) => {
              if (!r.ok) {
                throw new Error('HTTP ' + r.status);
              }
              return r.json();
            })
            .then((json) => {
              lastResult = json;
              countBadge.textContent =
                json.count ?? (json.emails ? json.emails.length : 0);
              statusEl.textContent =
                'Loaded ' + (json.emails ? json.emails.length : 0) + ' emails';
              renderList(json.emails || []);
              if (!(json.emails || []).length) {
                frame.style.display = 'none';
                emptyState.style.display = 'flex';
                emptyState.innerHTML = 'No emails found for current query.';
              }
            })
            .catch((err) => {
              showError('Fetch failed: ' + err.message);
              statusEl.textContent = 'Error';
            })
            .finally(() => setLoading(false));
        }

        refreshBtn.addEventListener('click', refresh);
        clearBtn.addEventListener('click', () => {
          clearConfig();
          listEl.innerHTML = '';
          frame.style.display = 'none';
          textViewer.style.display = 'none';
          viewToggle.style.display = 'none';
          emptyState.style.display = 'flex';
          emptyState.innerHTML = 'Cleared configuration.';
          countBadge.textContent = '0';
          statusEl.textContent = 'Cleared.';
          currentEmail = null;
        });

        btnHtml.addEventListener('click', () => {
          if (currentEmail) {
            showEmailContent(currentEmail, 'html');
          }
        });

        btnText.addEventListener('click', () => {
          if (currentEmail) {
            showEmailContent(currentEmail, 'text');
          }
        });

        [apikeyEl, namespaceEl, tagEl, limitEl].forEach((el) =>
          el.addEventListener('change', saveConfig)
        );
        loadConfig();
      })();
    </script>
  </body>
</html>
